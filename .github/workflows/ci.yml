name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: one source of truth (live page = kernel.mjs = skill script)
        run: node build.mjs --check
      - name: tests (the kernel, the shipped skill script run alone as Agensi runs it, and the MCP server spawned and spoken to)
        run: npm test
      - name: the recorded agent call on the page is what the server answers today
        run: node stdio.mjs < trace/mcp-call.in.jsonl | diff - trace/mcp-call.out.jsonl
      - name: the cost case kernel (checkcase.mjs) and its sourced basis
        run: node --test checkcase.test.mjs
      - name: the committed mutation receipt is for this kernel and these tests
        run: node gate.mjs --verify
      - name: Agensi ZIP (package rules checked, SHA-256 printed)
        run: node make-zip.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: agensi-zip
          path: dist/*.zip
  witness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: witness v0.6 mutation gate on the kernel (every mutant)
        uses: sjgant80-hub/witness@v0.6
        with:
          files: kernel.mjs
          test-command: node --test kernel.test.mjs
          cap: 100000
          node-version: 20
          fuzz: kernel.mjs:verifyClaim kernel.mjs:verifyLedger kernel.mjs:normalize kernel.mjs:verify
  witness-checkcase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: witness v0.6 mutation gate on the cost case kernel (every mutant)
        uses: sjgant80-hub/witness@v0.6
        with:
          files: checkcase.mjs
          test-command: node --test checkcase.test.mjs
          cap: 100000
          node-version: 20
          fuzz: checkcase.mjs:checkCase checkcase.mjs:figures
  witness-mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: witness v0.6 mutation gate on the MCP server (every mutant)
        uses: sjgant80-hub/witness@v0.6
        with:
          files: mcp.mjs stdio.mjs
          test-command: node --test mcp.test.mjs
          cap: 100000
          node-version: 20
          fuzz: mcp.mjs:handleRpc
  witness-page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: witness v0.6 mutation gate on the page's claim-check code (every mutant)
        uses: sjgant80-hub/witness@v0.6
        with:
          files: claim-page.js
          test-command: node --test page.test.mjs
          cap: 100000
          node-version: 20
  witness-genome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: witness v0.6 mutation gate on the genome cell's judge, lane and health (every mutant)
        uses: sjgant80-hub/witness@v0.6
        with:
          files: genome/cell.mjs
          test-command: node --test genome.test.mjs
          cap: 100000
          node-version: 20
          fuzz: genome/cell.mjs:judge genome/cell.mjs:inLane
  npx-from-github:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: which npm
        run: npm --version
      # The exact line on the page, with no commit pinned: npm 10 cannot run it pinned to a full commit hash
      # (github:...#<sha> stopped with "GitFetcher requires an Arborist constructor" on npm 10.8.2 and 10.9.9 in run
      # 44919277606; npm 11.19.1 ran it). So the run checks that main is still this commit, and then runs the plain line.
      - name: the install line on the page, run for real (npx -y github:sjgant80-hub/kar-citelock), no account
        env:
          CITELOCK_MCP_NPX: github:sjgant80-hub/kar-citelock
        run: |
          head=$(git ls-remote https://github.com/sjgant80-hub/kar-citelock refs/heads/main | cut -f1)
          if [ "$head" != "$GITHUB_SHA" ]; then echo "::notice::main has moved on to $head; the run for that commit tests the npx line"; exit 0; fi
          node --test mcp.test.mjs
      - name: npm's own log, when npx failed
        if: failure()
        run: tail -n 80 ~/.npm/_logs/*.log
